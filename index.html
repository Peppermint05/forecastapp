<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <link rel="stylesheet" href="src/style.css"/>
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="weather-app">
    <header>
        <form class="search-form">
            <input type="search" placeholder="Search for a city..." required class="search-form-input"/>
            <input type="submit" value="Search" class="search-form-button"/>
        </form>
    </header>
    <main>
        <div class="weather-app-data">
        <div>
        <h1 class="weather-app-city">San Francisco </h1>
        <div class="weather-description">
        <p>Monday 16:37, scattered clouds
            <br/>
            Humidity: <strong class="humidity">72%</strong> , Wind:<strong class="wind"> 3.6 Km/h</strong>
        </p>
        </div>

        </div>
       <div class="temperature"><strong class="emoji">🌤️</strong>32<strong class="degree">&deg;C</strong>
    </div> 
       </div>
    </main>
    

<footer>
    Built by <a href="https://github.com/Peppermint05">Precious</a>
    hosted on <a href="https://preciousweather.netlify.app/">Netlify</a>
</div>
</footer>
<script src="src/index.js"></script>
</body>
</html>
